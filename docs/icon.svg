    <path d="M46.3 21.8 51 25l1-5.6" fill="none" stroke="#dc143c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M23 37 27 41.5M43.5 43.5 46.5 42" stroke="#dc143c" stroke-width="3" stroke-linecap="round"/>
    <rect x="3" y="24" width="20" height="20" rx="5" fill="#dc143c"/>
    <path d="M8 34h10M13 29v10" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="35" cy="45" r="9" fill="#fff" stroke="#dc143c" stroke-width="3"/>
    <circle cx="54" cy="40" r="8.5" fill="#fff" stroke="#dc143c" stroke-width="3"/>
    <g fill="#dc143c" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
    <text x="35" y="49.6">1</text>
