name: CI

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile sources
        run: python -m compileall -q src

      # tests.py prints "[True]"/"[False]" per check and always exits 0,
      # so fail the job when any check reports False.
      - name: Run tests
        working-directory: src
        run: |
          python tests.py | tee test-output.txt
          if grep -q "\[False\]" test-output.txt; then
            echo "::error::Some round-trip conversions failed"
            exit 1
          fi
